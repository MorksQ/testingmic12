<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life OS — Progress Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #F8F7FF;
      --sidebar: #1A0533;
      --sidebar-text: #E9D5FF;
      --card: #FFFFFF;
      --card-border: #EDE9FE;
      --primary: #7C3AED;
      --primary-light: #A855F7;
      --accent-success: #10B981;
      --accent-danger: #F43F5E;
      --accent-warning: #F59E0B;
      --text-heading: #0F0A1E;
      --text-body: #374151;
      --text-muted: #6B7280;
      --shadow: 0 4px 24px rgba(124,58,237,0.08);
      --sidebar-w: 248px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text-body);
      min-height: 100vh;
      line-height: 1.5;
    }
    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; cursor: pointer; }
    .app { display: flex; min-height: 100vh; }
    .sidebar {
      width: var(--sidebar-w);
      min-height: 100vh;
      background: linear-gradient(180deg, #1A0533 0%, #2D0F4E 100%);
      display: flex;
      flex-direction: column;
      position: fixed;
      left: 0; top: 0;
      z-index: 200;
      overflow: hidden;
    }
    .sidebar::before {
      content: '';
      position: absolute;
      top: -100px; left: -60px;
      width: 260px; height: 260px;
      background: radial-gradient(circle, rgba(124,58,237,0.28) 0%, transparent 65%);
      pointer-events: none;
    }
    .sidebar::after {
      content: '';
      position: absolute;
      bottom: 60px; right: -60px;
      width: 180px; height: 180px;
      background: radial-gradient(circle, rgba(168,85,247,0.15) 0%, transparent 65%);
      pointer-events: none;
    }
    .sidebar-logo {
      padding: 26px 20px 22px;
      display: flex;
      align-items: center;
      gap: 11px;
      border-bottom: 1px solid rgba(233,213,255,0.07);
      position: relative;
      z-index: 1;
    }
    .logo-icon {
      width: 38px; height: 38px;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      border-radius: 11px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 800; color: #fff;
      flex-shrink: 0;
      box-shadow: 0 4px 14px rgba(124,58,237,0.45);
      position: relative;
    }
    .logo-icon .diamond {
      position: absolute;
      top: -5px; right: -5px;
      width: 12px; height: 12px;
      background: var(--primary-light);
      clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
    }
    .logo-wordmark { line-height: 1; }
    .logo-wordmark .name { font-size: 15px; font-weight: 800; color: #fff; letter-spacing: 0.07em; }
    .logo-wordmark .sub { font-size: 8.5px; color: var(--sidebar-text); opacity: 0.45; letter-spacing: 0.1em; text-transform: uppercase; margin-top: 2px; }
    .sidebar-nav { flex: 1; padding: 18px 12px; display: flex; flex-direction: column; gap: 2px; position: relative; z-index: 1; }
    .nav-item {
      display: flex; align-items: center; gap: 11px;
      padding: 11px 14px; border-radius: 12px;
      color: var(--sidebar-text); font-size: 13px; font-weight: 500;
      opacity: 0.62; transition: all 0.18s ease;
      cursor: pointer; border: none; background: none;
      width: 100%; text-align: left;
    }
    .nav-item:hover { opacity: 1; background: rgba(233,213,255,0.07); }
    .nav-item.active { background: rgba(124,58,237,0.38); color: #fff; opacity: 1; font-weight: 600; }
    .nav-icon { font-size: 17px; width: 22px; text-align: center; flex-shrink: 0; }
    .sidebar-bottom { padding: 12px 12px 22px; border-top: 1px solid rgba(233,213,255,0.07); position: relative; z-index: 1; }
    .sidebar-profile { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 12px; cursor: pointer; transition: background 0.18s; margin-top: 4px; }
    .sidebar-profile:hover { background: rgba(233,213,255,0.07); }
    .profile-avatar { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--primary-light)); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #fff; flex-shrink: 0; }
    .profile-info .pname { font-size: 12px; font-weight: 700; color: #fff; }
    .profile-info .prole { font-size: 10px; color: var(--sidebar-text); opacity: 0.45; }
    .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(15,10,30,0.55); z-index: 190; backdrop-filter: blur(2px); }
    .sidebar-overlay.open { display: block; }
    .sidebar-close-btn { display: none; position: absolute; top: 14px; right: 14px; background: rgba(255,255,255,0.08); border: none; color: #fff; width: 30px; height: 30px; border-radius: 8px; font-size: 16px; align-items: center; justify-content: center; }
    .main { margin-left: var(--sidebar-w); flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
    .topbar { background: var(--card); border-bottom: 1px solid var(--card-border); height: 70px; padding: 0 30px; display: flex; align-items: center; justify-content: space-between; gap: 20px; position: sticky; top: 0; z-index: 100; }
    .topbar-left { display: flex; align-items: center; gap: 14px; }
    .hamburger { display: none; flex-direction: column; gap: 4.5px; background: none; border: none; padding: 4px; }
    .hamburger span { display: block; width: 21px; height: 2px; background: var(--text-heading); border-radius: 2px; }
    .greeting-wrap .greeting { font-size: 17px; font-weight: 800; color: var(--text-heading); line-height: 1.2; }
    .greeting-wrap .subtext { font-size: 11.5px; color: var(--text-muted); margin-top: 1px; }
    .topbar-center { display: flex; flex-direction: column; align-items: center; gap: 5px; }
    .week-label { font-size: 9.5px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; }
    .week-row { display: flex; gap: 10px; align-items: center; }
    .week-day { display: flex; flex-direction: column; align-items: center; gap: 5px; }
    .day-char { font-size: 8.5px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
    .day-dot { width: 11px; height: 11px; border-radius: 50%; background: #E9E7FF; border: 1.5px solid #D8D4FF; transition: all 0.2s; }
    .week-day.done .day-dot { background: var(--primary); border-color: var(--primary); box-shadow: 0 0 0 2px rgba(124,58,237,0.18); }
    .week-day.today .day-dot { background: var(--primary-light); border-color: var(--primary-light); box-shadow: 0 0 0 3px rgba(168,85,247,0.22); }
    .topbar-right { display: flex; align-items: center; gap: 14px; }
    .date-block { text-align: right; }
    .date-block .d1 { font-size: 13px; font-weight: 700; color: var(--text-heading); }
    .date-block .d2 { font-size: 10.5px; color: var(--text-muted); }
    .notif-btn { width: 38px; height: 38px; background: var(--bg); border: 1px solid var(--card-border); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 17px; position: relative; cursor: pointer; transition: background 0.15s; }
    .notif-btn:hover { background: var(--card-border); }
    .notif-dot { position: absolute; top: 8px; right: 8px; width: 7px; height: 7px; background: var(--accent-danger); border-radius: 50%; border: 1.5px solid #fff; }
    .topbar-avatar { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--primary-light)); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #fff; cursor: pointer; box-shadow: 0 0 0 3px rgba(124,58,237,0.22); }
    .content { padding: 26px 30px 52px; flex: 1; }
    .hero { background: linear-gradient(135deg, #1A0533 0%, #4C1D95 55%, #2D0F4E 100%); border-radius: 22px; padding: 34px 38px; margin-bottom: 22px; display: flex; justify-content: space-between; align-items: center; gap: 20px; position: relative; overflow: hidden; min-height: 180px; }
    .hero-shape1 { position: absolute; top: -50px; right: 200px; width: 200px; height: 200px; border: 1px solid rgba(168,85,247,0.14); border-radius: 50%; pointer-events: none; }
    .hero-shape2 { position: absolute; bottom: -45px; left: 38%; width: 150px; height: 150px; border: 1px solid rgba(168,85,247,0.1); border-radius: 50%; pointer-events: none; }
    .hero-shape3 { position: absolute; top: 18px; right: 230px; width: 70px; height: 70px; border: 1px solid rgba(168,85,247,0.12); border-radius: 14px; transform: rotate(22deg); pointer-events: none; }
    .hero-shape4 { position: absolute; bottom: 22px; left: 28%; width: 44px; height: 44px; border: 1px solid rgba(168,85,247,0.1); border-radius: 50%; pointer-events: none; }
    .hero-glow { position: absolute; top: 50%; left: 8%; transform: translateY(-50%); width: 130px; height: 130px; background: radial-gradient(circle, rgba(124,58,237,0.22) 0%, transparent 70%); pointer-events: none; }
    .hero-left { position: relative; z-index: 2; flex: 1; }
    .hero-eyebrow { display: inline-flex; align-items: center; gap: 6px; background: rgba(168,85,247,0.18); border: 1px solid rgba(168,85,247,0.3); border-radius: 9999px; padding: 4px 13px; font-size: 10.5px; font-weight: 700; color: #D8B4FE; margin-bottom: 13px; text-transform: uppercase; letter-spacing: 0.07em; }
    .hero-title { font-size: 27px; font-weight: 800; color: #fff; line-height: 1.18; letter-spacing: -0.02em; margin-bottom: 9px; }
    .hero-sub { font-size: 13px; color: rgba(233,213,255,0.68); margin-bottom: 22px; }
    .hero-cta { display: inline-flex; align-items: center; gap: 7px; background: var(--primary); color: #fff; border: none; border-radius: 9999px; padding: 11px 24px; font-size: 13px; font-weight: 700; transition: all 0.2s; }
    .hero-cta:hover { background: var(--primary-light); transform: translateY(-1px); box-shadow: 0 8px 24px rgba(124,58,237,0.45); }
    .hero-ring { position: relative; z-index: 2; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .ring-wrap { position: relative; width: 140px; height: 140px; }
    .ring-svg { transform: rotate(-90deg); width: 140px; height: 140px; }
    .ring-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
    .ring-pct { font-size: 28px; font-weight: 800; color: #fff; line-height: 1; }
    .ring-lbl { font-size: 9.5px; color: rgba(233,213,255,0.55); text-transform: uppercase; letter-spacing: 0.07em; margin-top: 2px; }
    .ring-caption { font-size: 11px; color: rgba(233,213,255,0.55); text-align: center; }
    .year-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .ytab { padding: 8px 22px; border-radius: 9999px; font-size: 13px; font-weight: 600; border: 1.5px solid var(--primary); color: var(--primary); background: #fff; transition: all 0.18s; cursor: pointer; }
    .ytab:hover { background: rgba(124,58,237,0.06); }
    .ytab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .stats-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 16px; margin-bottom: 22px; }
    .stat-card { background: var(--card); border: 1px solid var(--card-border); border-radius: 16px; padding: 18px 20px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 14px; }
    .stat-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
    .stat-value { font-size: 24px; font-weight: 800; color: var(--text-heading); line-height: 1; margin-bottom: 3px; }
    .stat-label { font-size: 11px; font-weight: 500; color: var(--text-muted); }
    .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 28px; }
    .kpi-card { background: var(--card); border: 1px solid var(--card-border); border-left: 4px solid var(--card-border); border-radius: 20px; padding: 22px 24px; box-shadow: var(--shadow); transition: all 0.22s ease; display: flex; flex-direction: column; }
    .kpi-card:hover { transform: translateY(-3px); box-shadow: 0 12px 36px rgba(124,58,237,0.14); border-color: var(--primary-light); }
    .kpi-card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
    .kpi-cat-info { display: flex; align-items: center; gap: 9px; }
    .kpi-emoji { font-size: 21px; line-height: 1; }
    .kpi-catname { font-size: 15px; font-weight: 700; color: var(--text-heading); }
    .pct-badge { background: rgba(124,58,237,0.1); color: var(--primary); border-radius: 9999px; padding: 4px 12px; font-size: 12px; font-weight: 700; }
    .kpi-row { margin-bottom: 15px; }
    .kpi-row:last-of-type { margin-bottom: 0; }
    .kpi-row-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 5px; }
    .kpi-name { font-size: 12.5px; font-weight: 600; color: var(--text-body); }
    .kpi-nums { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
    .kpi-nums b { color: var(--text-body); font-weight: 600; }
    .kpi-pct-num { font-size: 13px; font-weight: 800; white-space: nowrap; }
    .kpi-bar-bg { height: 6px; background: var(--bg); border-radius: 9999px; overflow: hidden; }
    .kpi-bar-fill { height: 100%; border-radius: 9999px; transition: width 0.6s ease; min-width: 4px; }
    .kpi-card-foot { margin-top: 16px; padding-top: 13px; border-top: 1px solid var(--card-border); display: flex; align-items: center; justify-content: space-between; }
    .tap-hint { font-size: 11px; color: var(--text-muted); }
    .edit-link { font-size: 11px; font-weight: 700; color: var(--primary); background: none; border: none; transition: opacity 0.15s; }
    .edit-link:hover { opacity: 0.65; }
    .charts-row { display: grid; grid-template-columns: 1.3fr 1fr; gap: 18px; }
    .chart-card { background: var(--card); border: 1px solid var(--card-border); border-radius: 20px; padding: 26px 28px; box-shadow: var(--shadow); }
    .chart-head { margin-bottom: 20px; }
    .chart-title { font-size: 15px; font-weight: 700; color: var(--text-heading); margin-bottom: 2px; }
    .chart-sub { font-size: 11.5px; color: var(--text-muted); }
    .chart-legend { display: flex; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
    .leg-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-muted); font-weight: 500; }
    .leg-dot { width: 10px; height: 10px; border-radius: 3px; }
    .bar-chart-area { position: relative; height: 200px; padding-left: 36px; padding-bottom: 36px; }
    .bar-chart-grid { position: absolute; left: 36px; right: 0; top: 0; bottom: 30px; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; }
    .bar-grid-line { width: 100%; height: 1px; background: var(--card-border); position: relative; }
    .bar-grid-line::before { content: attr(data-label); position: absolute; left: -32px; top: -6px; font-size: 9px; color: var(--text-muted); font-weight: 500; font-family: inherit; }
    .bar-chart-bars { position: absolute; left: 36px; right: 0; top: 0; bottom: 30px; display: flex; align-items: flex-end; justify-content: space-around; }
    .bar-group { display: flex; align-items: flex-end; gap: 3px; flex: 1; max-width: 60px; position: relative; }
    .bar-col { flex: 1; border-radius: 5px 5px 0 0; min-height: 4px; position: relative; transition: opacity 0.15s; }
    .bar-col:hover { opacity: 0.8; }
    .bar-col::after { content: attr(data-tip); position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%) translateY(-4px); background: var(--text-heading); color: #fff; padding: 3px 8px; border-radius: 6px; font-size: 10px; font-weight: 600; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 0.15s; }
    .bar-col:hover::after { opacity: 1; }
    .bar-group-label { position: absolute; bottom: -28px; left: 50%; transform: translateX(-50%); font-size: 15px; white-space: nowrap; }
    .line-chart-svg-wrap svg { width: 100%; height: 200px; }
    .line-x-labels { display: flex; justify-content: space-between; margin-top: 6px; padding: 0 8px; }
    .line-x-labels span { font-size: 10px; color: var(--text-muted); font-weight: 600; text-align: center; flex: 1; }
    .line-x-labels span.active-yr { color: var(--primary); }
    .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(15,10,30,0.58); backdrop-filter: blur(5px); z-index: 500; align-items: center; justify-content: center; padding: 20px; }
    .modal-backdrop.open { display: flex; }
    .modal { background: var(--card); border-radius: 24px; padding: 32px; width: 100%; max-width: 460px; box-shadow: 0 28px 64px rgba(0,0,0,0.22); animation: modalIn 0.22s ease; }
    @keyframes modalIn { from { opacity: 0; transform: scale(0.96) translateY(8px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    .modal-title { font-size: 20px; font-weight: 800; color: var(--text-heading); margin-bottom: 4px; }
    .modal-sub { font-size: 12.5px; color: var(--text-muted); margin-bottom: 24px; }
    .modal-kpi-block { padding-bottom: 18px; margin-bottom: 18px; border-bottom: 1px solid var(--card-border); }
    .modal-kpi-block:last-of-type { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .modal-kpi-label { font-size: 13px; font-weight: 700; color: var(--text-heading); margin-bottom: 12px; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .field-group { display: flex; flex-direction: column; gap: 5px; }
    .field-label { font-size: 11px; font-weight: 700; color: var(--text-body); }
    .field-input { padding: 10px 13px; border: 1.5px solid var(--card-border); border-radius: 11px; font-size: 14px; font-weight: 600; color: var(--text-heading); background: var(--bg); outline: none; font-family: inherit; transition: border-color 0.18s; }
    .field-input:focus { border-color: var(--primary); }
    .modal-actions { display: flex; gap: 10px; margin-top: 24px; }
    .btn-cancel { flex: 1; padding: 11px; border: 1.5px solid var(--card-border); border-radius: 12px; background: none; font-size: 13px; font-weight: 600; color: var(--text-muted); transition: all 0.18s; }
    .btn-cancel:hover { border-color: var(--text-muted); color: var(--text-body); }
    .btn-save { flex: 2; padding: 11px; border: none; border-radius: 12px; background: var(--primary); color: #fff; font-size: 13px; font-weight: 700; transition: background 0.18s; }
    .btn-save:hover { background: var(--primary-light); }
    @media (max-width: 1080px) { .charts-row { grid-template-columns: 1fr; } .stats-row { grid-template-columns: repeat(2,1fr); } }
    @media (max-width: 820px) {
      :root { --sidebar-w: 0px; }
      .sidebar { width: 248px; transform: translateX(-100%); transition: transform 0.28s ease; }
      .sidebar.open { transform: translateX(0); }
      .sidebar-close-btn { display: flex; }
      .main { margin-left: 0; }
      .hamburger { display: flex; }
      .topbar { padding: 0 18px; }
      .topbar-center { display: none; }
      .content { padding: 18px 16px 48px; }
      .kpi-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 560px) { .stats-row { grid-template-columns: 1fr 1fr; } .hero { padding: 22px 20px; } .hero-ring { display: none; } .date-block { display: none; } }
  </style>
</head>
<body>
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="modal-title" id="modalTitle">Edit KPI</div>
    <div class="modal-sub" id="modalSub"></div>
    <div id="modalBody"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveModal()">Save Changes</button>
    </div>
  </div>
</div>
<div class="app">
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
  <aside class="sidebar" id="sidebar">
    <button class="sidebar-close-btn" onclick="closeSidebar()">&#x2715;</button>
    <div class="sidebar-logo">
      <div class="logo-icon">L<span class="diamond"></span></div>
      <div class="logo-wordmark">
        <div class="name">LIFE OS</div>
        <div class="sub">Progress Dashboard</div>
      </div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav">
      <button class="nav-item active" data-nav="dashboard"><span class="nav-icon">&#x1F3E0;</span>Dashboard</button>
      <button class="nav-item" data-nav="finance"><span class="nav-icon">&#x1F4B0;</span>Finance</button>
      <button class="nav-item" data-nav="health"><span class="nav-icon">&#x1F3CB;&#xFE0F;</span>Health</button>
      <button class="nav-item" data-nav="career"><span class="nav-icon">&#x1F4BC;</span>Career</button>
      <button class="nav-item" data-nav="relationships"><span class="nav-icon">&#x2764;&#xFE0F;</span>Relationships</button>
      <button class="nav-item" data-nav="growth"><span class="nav-icon">&#x1F4DA;</span>Personal Growth</button>
      <button class="nav-item" data-nav="journal"><span class="nav-icon">&#x1F4D3;</span>Journal</button>
    </nav>
    <div class="sidebar-bottom">
      <button class="nav-item" style="opacity:0.55;"><span class="nav-icon">&#x2699;&#xFE0F;</span>Settings</button>
      <div class="sidebar-profile">
        <div class="profile-avatar" id="sidebarAvatar">A</div>
        <div class="profile-info">
          <div class="pname" id="sidebarName">Alex Johnson</div>
          <div class="prole">Premium Plan</div>
        </div>
      </div>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="hamburger" onclick="openSidebar()"><span></span><span></span><span></span></button>
        <div class="greeting-wrap">
          <div class="greeting" id="greeting">Good Morning, Alex &#x1F44B;</div>
          <div class="subtext">Track your progress. Own your future.</div>
        </div>
      </div>

<script>
function defaultData(){return{userName:"Alex",currentYear:0,years:[{year:1,label:"Year 1",buckets:[{id:"finance",name:"Finance",emoji:"\u{1F4B0}",color:"#7C3AED",kpis:[{name:"Net Worth Target",planned:50000,achieved:42000,pre:"$",suf:"",inv:false},{name:"Monthly Savings Rate",planned:1500,achieved:1100,pre:"$",suf:"/mo",inv:false}]},{id:"health",name:"Health",emoji:"\u{1F3CB}️",color:"#10B981",kpis:[{name:"Workout Days / Week",planned:5,achieved:4,pre:"",suf:" days",inv:false},{name:"Body Weight Goal",planned:175,achieved:181,pre:"",suf:" lbs",inv:true}]},{id:"career",name:"Career",emoji:"\u{1F4BC}",color:"#F59E0B",kpis:[{name:"Annual Income",planned:80000,achieved:76000,pre:"$",suf:"",inv:false},{name:"Skills Learned",planned:6,achieved:4,pre:"",suf:"",inv:false}]},{id:"relationships",name:"Relationships",emoji:"❤️",color:"#F43F5E",kpis:[{name:"Family Time",planned:8,achieved:6,pre:"",suf:" hrs/wk",inv:false},{name:"New Connections",planned:24,achieved:18,pre:"",suf:"",inv:false}]},{id:"growth",name:"Personal Growth",emoji:"\u{1F4DA}",color:"#06B6D4",kpis:[{name:"Books Read",planned:24,achieved:18,pre:"",suf:"",inv:false},{name:"Meditation Days",planned:200,achieved:145,pre:"",suf:" days",inv:false}]}]},{year:2,label:"Year 2",buckets:[{id:"finance",name:"Finance",emoji:"\u{1F4B0}",color:"#7C3AED",kpis:[{name:"Net Worth Target",planned:100000,achieved:95000,pre:"$",suf:"",inv:false},{name:"Monthly Savings Rate",planned:2000,achieved:1850,pre:"$",suf:"/mo",inv:false}]},{id:"health",name:"Health",emoji:"\u{1F3CB}️",color:"#10B981",kpis:[{name:"Workout Days / Week",planned:5,achieved:5,pre:"",suf:" days",inv:false},{name:"Body Weight Goal",planned:170,achieved:173,pre:"",suf:" lbs",inv:true}]},{id:"career",name:"Career",emoji:"\u{1F4BC}",color:"#F59E0B",kpis:[{name:"Annual Income",planned:100000,achieved:98000,pre:"$",suf:"",inv:false},{name:"Skills Learned",planned:8,achieved:7,pre:"",suf:"",inv:false}]},{id:"relationships",name:"Relationships",emoji:"❤️",color:"#F43F5E",kpis:[{name:"Family Time",planned:10,achieved:9,pre:"",suf:" hrs/wk",inv:false},{name:"New Connections",planned:30,achieved:28,pre:"",suf:"",inv:false}]},{id:"growth",name:"Personal Growth",emoji:"\u{1F4DA}",color:"#06B6D4",kpis:[{name:"Books Read",planned:30,achieved:27,pre:"",suf:"",inv:false},{name:"Meditation Days",planned:250,achieved:220,pre:"",suf:" days",inv:false}]}]},{year:3,label:"Year 3",buckets:[{id:"finance",name:"Finance",emoji:"\u{1F4B0}",color:"#7C3AED",kpis:[{name:"Net Worth Target",planned:180000,achieved:175000,pre:"$",suf:"",inv:false},{name:"Monthly Savings Rate",planned:3000,achieved:2900,pre:"$",suf:"/mo",inv:false}]},{id:"health",name:"Health",emoji:"\u{1F3CB}️",color:"#10B981",kpis:[{name:"Workout Days / Week",planned:6,achieved:6,pre:"",suf:" days",inv:false},{name:"Body Weight Goal",planned:168,achieved:169,pre:"",suf:" lbs",inv:true}]},{id:"career",name:"Career",emoji:"\u{1F4BC}",color:"#F59E0B",kpis:[{name:"Annual Income",planned:130000,achieved:128000,pre:"$",suf:"",inv:false},{name:"Skills Learned",planned:10,achieved:10,pre:"",suf:"",inv:false}]},{id:"relationships",name:"Relationships",emoji:"❤️",color:"#F43F5E",kpis:[{name:"Family Time",planned:12,achieved:11,pre:"",suf:" hrs/wk",inv:false},{name:"New Connections",planned:40,achieved:38,pre:"",suf:"",inv:false}]},{id:"growth",name:"Personal Growth",emoji:"\u{1F4DA}",color:"#06B6D4",kpis:[{name:"Books Read",planned:36,achieved:35,pre:"",suf:"",inv:false},{name:"Meditation Days",planned:300,achieved:295,pre:"",suf:" days",inv:false}]}]},{year:4,label:"Year 4",buckets:[{id:"finance",name:"Finance",emoji:"\u{1F4B0}",color:"#7C3AED",kpis:[{name:"Net Worth Target",planned:300000,achieved:295000,pre:"$",suf:"",inv:false},{name:"Monthly Savings Rate",planned:4000,achieved:3950,pre:"$",suf:"/mo",inv:false}]},{id:"health",name:"Health",emoji:"\u{1F3CB}️",color:"#10B981",kpis:[{name:"Workout Days / Week",planned:6,achieved:6,pre:"",suf:" days",inv:false},{name:"Body Weight Goal",planned:165,achieved:165,pre:"",suf:" lbs",inv:true}]},{id:"career",name:"Career",emoji:"\u{1F4BC}",color:"#F59E0B",kpis:[{name:"Annual Income",planned:160000,achieved:162000,pre:"$",suf:"",inv:false},{name:"Skills Learned",planned:12,achieved:13,pre:"",suf:"",inv:false}]},{id:"relationships",name:"Relationships",emoji:"❤️",color:"#F43F5E",kpis:[{name:"Family Time",planned:14,achieved:14,pre:"",suf:" hrs/wk",inv:false},{name:"New Connections",planned:50,achieved:52,pre:"",suf:"",inv:false}]},{id:"growth",name:"Personal Growth",emoji:"\u{1F4DA}",color:"#06B6D4",kpis:[{name:"Books Read",planned:48,achieved:48,pre:"",suf:"",inv:false},{name:"Meditation Days",planned:340,achieved:340,pre:"",suf:" days",inv:false}]}]},{year:5,label:"Year 5",buckets:[{id:"finance",name:"Finance",emoji:"\u{1F4B0}",color:"#7C3AED",kpis:[{name:"Net Worth Target",planned:500000,achieved:480000,pre:"$",suf:"",inv:false},{name:"Monthly Savings Rate",planned:6000,achieved:5800,pre:"$",suf:"/mo",inv:false}]},{id:"health",name:"Health",emoji:"\u{1F3CB}️",color:"#10B981",kpis:[{name:"Workout Days / Week",planned:6,achieved:6,pre:"",suf:" days",inv:false},{name:"Body Weight Goal",planned:162,achieved:163,pre:"",suf:" lbs",inv:true}]},{id:"career",name:"Career",emoji:"\u{1F4BC}",color:"#F59E0B",kpis:[{name:"Annual Income",planned:200000,achieved:195000,pre:"$",suf:"",inv:false},{name:"Skills Learned",planned:15,achieved:16,pre:"",suf:"",inv:false}]},{id:"relationships",name:"Relationships",emoji:"❤️",color:"#F43F5E",kpis:[{name:"Family Time",planned:16,achieved:16,pre:"",suf:" hrs/wk",inv:false},{name:"New Connections",planned:60,achieved:58,pre:"",suf:"",inv:false}]},{id:"growth",name:"Personal Growth",emoji:"\u{1F4DA}",color:"#06B6D4",kpis:[{name:"Books Read",planned:60,achieved:58,pre:"",suf:"",inv:false},{name:"Meditation Days",planned:360,achieved:355,pre:"",suf:" days",inv:false}]}]}]}}
function load(){try{const s=localStorage.getItem('lifeOS_v3');return s?JSON.parse(s):defaultData();}catch{return defaultData();}}
function save(d){localStorage.setItem('lifeOS_v3',JSON.stringify(d));}
let D=load(),YI=D.currentYear||0,editCtx=null;
function kpiPct(k){if(k.planned<=0)return 0;if(k.inv)return Math.min(100,Math.round((k.planned/Math.max(k.achieved,0.01))*100));return Math.min(100,Math.round((k.achieved/k.planned)*100));}
function bucketPct(b){const ps=b.kpis.map(kpiPct);return Math.round(ps.reduce((a,v)=>a+v,0)/ps.length);}
function yearPct(y){const ps=y.buckets.map(bucketPct);return Math.round(ps.reduce((a,v)=>a+v,0)/ps.length);}
function fmtVal(v,pre,suf){let s=v;if(pre==='$'){if(v>=1000000)s=(v/1000000).toFixed(1)+'M';else if(v>=1000)s=(v/1000).toFixed(0)+'K';}return pre+s+suf;}
function pctColor(p){return p>=80?'var(--accent-success)':p>=50?'var(--primary)':'var(--accent-danger)';}
function barGrad(p){return p<50?'linear-gradient(90deg,#F43F5E,#FB7185)':'linear-gradient(90deg,#7C3AED,#A855F7)';}
function renderGreeting(){const h=new Date().getHours(),t=h<12?'Morning':h<17?'Afternoon':'Evening';document.getElementById('greeting').textContent=`Good ${t}, ${D.userName} \u{1F44B}`;const i=D.userName.charAt(0).toUpperCase();document.getElementById('sidebarAvatar').textContent=i;document.getElementById('topbarAvatar').textContent=i;document.getElementById('sidebarName').textContent=D.userName+' Johnson';}
function renderDate(){const now=new Date(),DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];document.getElementById('dateMain').textContent=`${DAYS[now.getDay()]}, ${MONTHS[now.getMonth()]} ${now.getDate()}`;document.getElementById('dateSub').textContent=now.getFullYear();}
function renderWeekStreak(){const L=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],tj=new Date().getDay(),tm=tj===0?6:tj-1;let h='<div class="week-label">This Week</div><div class="week-row">';L.forEach((l,i)=>{const c=i<tm?'done':i===tm?'today':'';h+=`<div class="week-day ${c}"><div class="day-dot"></div><div class="day-char">${l}</div></div>`;});h+='</div>';document.getElementById('weekStreak').innerHTML=h;}
function renderHero(){const y=D.years[YI],ov=yearPct(y),kb=y.buckets[0],tk=kb.kpis[0],C=2*Math.PI*56,off=C-(ov/100)*C;document.getElementById('heroLeft').innerHTML=`<div class="hero-eyebrow">\u{1F4CC} ${y.label} &nbsp;&middot;&nbsp; Top Priority KPI</div><div class="hero-title">${tk.name}</div><div class="hero-sub">${kb.emoji} ${kb.name} &nbsp;&middot;&nbsp; Target: ${fmtVal(tk.planned,tk.pre,tk.suf)}</div><button class="hero-cta" onclick="openModal(${YI},0,null)">&#x270F;&#xFE0F;&nbsp; Update Progress</button>`;document.getElementById('heroRing').innerHTML=`<div class="ring-wrap"><svg class="ring-svg" viewBox="0 0 140 140"><defs><linearGradient id="rg" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#A855F7"/><stop offset="100%" stop-color="#7C3AED"/></linearGradient></defs><circle cx="70" cy="70" r="56" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="10"/><circle cx="70" cy="70" r="56" fill="none" stroke="url(#rg)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}"/></svg><div class="ring-center"><div class="ring-pct">${ov}%</div><div class="ring-lbl">Overall</div></div></div><div class="ring-caption">${y.label} Progress</div>`;}
function renderYearTabs(){document.getElementById('yearTabs').innerHTML=D.years.map((y,i)=>`<button class="ytab${i===YI?' active':''}" onclick="selectYear(${i})">${y.label}</button>`).join('');}
function renderStats(){const y=D.years[YI],ov=yearPct(y),bps=y.buckets.map(bucketPct),on=bps.filter(p=>p>=80).length,beh=bps.filter(p=>p<50).length,bi=bps.indexOf(Math.max(...bps)),best=y.buckets[bi];document.getElementById('statsRow').innerHTML=`<div class="stat-card"><div class="stat-icon" style="background:rgba(124,58,237,0.1)">&#x1F4CA;</div><div><div class="stat-value">${ov}%</div><div class="stat-label">Overall Achieved</div></div></div><div class="stat-card"><div class="stat-icon" style="background:rgba(16,185,129,0.1)">&#x2705;</div><div><div class="stat-value" style="color:var(--accent-success)">${on}</div><div class="stat-label">KPIs On Track</div></div></div><div class="stat-card"><div class="stat-icon" style="background:rgba(244,63,94,0.1)">&#x26A0;&#xFE0F;</div><div><div class="stat-value" style="color:var(--accent-danger)">${beh}</div><div class="stat-label">KPIs Behind</div></div></div><div class="stat-card"><div class="stat-icon" style="background:rgba(245,158,11,0.1)">&#x2B50;</div><div><div class="stat-value" style="font-size:14px;line-height:1.3;letter-spacing:-0.01em">${best.emoji} ${best.name}</div><div class="stat-label">Best Category</div></div></div>`;}
function renderKPICards(){const y=D.years[YI];document.getElementById('kpiGrid').innerHTML=y.buckets.map((b,bi)=>{const bp=bucketPct(b),rows=b.kpis.map((k,ki)=>{const p=kpiPct(k),pc=pctColor(p),bg=barGrad(p);return`<div class="kpi-row"><div class="kpi-row-head"><div><div class="kpi-name">${k.name}</div><div class="kpi-nums">Planned: ${fmtVal(k.planned,k.pre,k.suf)} &nbsp;|&nbsp; Achieved: <b>${fmtVal(k.achieved,k.pre,k.suf)}</b></div></div><div class="kpi-pct-num" style="color:${pc}">${p}%</div></div><div class="kpi-bar-bg"><div class="kpi-bar-fill" style="width:${p}%;background:${bg}"></div></div></div>`;}).join('');return`<div class="kpi-card" style="border-left-color:${b.color}"><div class="kpi-card-head"><div class="kpi-cat-info"><span class="kpi-emoji">${b.emoji}</span><span class="kpi-catname">${b.name}</span></div><span class="pct-badge">${bp}%</span></div>${rows}<div class="kpi-card-foot"><span class="tap-hint">&#x270F;&#xFE0F; Tap to edit values</span><button class="edit-link" onclick="openModal(${YI},${bi},null)">Edit &rarr;</button></div></div>`;}).join('');}
function renderCharts(){const y=D.years[YI],maxH=148,gridLines=[100,75,50,25,0].map(v=>`<div class="bar-grid-line" data-label="${v}%"></div>`).join(''),barGroups=y.buckets.map((b,bi)=>{const bp=bucketPct(b),achH=Math.round((bp/100)*maxH);return`<div class="bar-group"><div class="bar-col" style="height:${maxH}px;background:rgba(168,85,247,0.35)" data-tip="Planned 100%"></div><div class="bar-col" style="height:${achH}px;background:var(--primary)" data-tip="Achieved ${bp}%"></div><div class="bar-group-label">${b.emoji}</div></div>`;}).join(''),W=320,H=170,PL=30,PT=12,PR=10,PB=24,CW=W-PL-PR,CH=H-PT-PB,allPcts=D.years.map(yearPct),pts=allPcts.map((p,i)=>({x:PL+(i/(allPcts.length-1))*CW,y:PT+CH-(p/100)*CH,p}));function cr(pts){if(pts.length<2)return'';let d=`M${pts[0].x},${pts[0].y}`;for(let i=0;i<pts.length-1;i++){const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)],c1x=p1.x+(p2.x-p0.x)/6,c1y=p1.y+(p2.y-p0.y)/6,c2x=p2.x-(p3.x-p1.x)/6,c2y=p2.y-(p3.y-p1.y)/6;d+=` C${c1x},${c1y},${c2x},${c2y},${p2.x},${p2.y}`;}return d;}
const line=cr(pts),fill=`${line} L${pts[pts.length-1].x},${PT+CH} L${pts[0].x},${PT+CH} Z`,gridY=[0,25,50,75,100].map(v=>{const gy=PT+CH-(v/100)*CH;return`<line x1="${PL}" y1="${gy}" x2="${PL+CW}" y2="${gy}" stroke="#EDE9FE" stroke-width="1"/><text x="${PL-5}" y="${gy+4}" text-anchor="end" font-size="8" fill="#9CA3AF">${v}%</text>`;}).join(''),dots=pts.map((pt,i)=>{const active=i===YI,ring=active?`<circle cx="${pt.x}" cy="${pt.y}" r="12" fill="rgba(124,58,237,0.15)" stroke="none"/>`:'';
return`${ring}<circle cx="${pt.x}" cy="${pt.y}" r="${active?7:4.5}" fill="${active?'#7C3AED':'#A855F7'}" stroke="white" stroke-width="${active?2.5:2}"/><text x="${pt.x}" y="${pt.y-14}" text-anchor="middle" font-size="${active?10:9}" fill="${active?'#5B21B6':'#7C3AED'}" font-weight="700">${pt.p}%</text>`;}).join(''),xLabels=D.years.map((yy,i)=>`<span class="${i===YI?'active-yr':''}">${yy.label}</span>`).join('');
document.getElementById('chartsRow').innerHTML=`<div class="chart-card"><div class="chart-head"><div class="chart-title">Planned vs Achieved &mdash; ${y.label}</div><div class="chart-sub">Category performance breakdown</div></div><div class="chart-legend"><div class="leg-item"><div class="leg-dot" style="background:rgba(168,85,247,0.4)"></div>Planned (100%)</div><div class="leg-item"><div class="leg-dot" style="background:var(--primary)"></div>Achieved</div></div><div class="bar-chart-area"><div class="bar-chart-grid">${gridLines}</div><div class="bar-chart-bars">${barGroups}</div></div></div><div class="chart-card"><div class="chart-head"><div class="chart-title">Your 5-Year Growth Trajectory</div><div class="chart-sub">Overall % achievement across all years</div></div><div class="line-chart-svg-wrap"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet"><defs><linearGradient id="lg" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#7C3AED" stop-opacity="0.22"/><stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/></linearGradient></defs>${gridY}<path d="${fill}" fill="url(#lg)"/><path d="${line}" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${dots}</svg><div class="line-x-labels">${xLabels}</div></div></div>`;}
function openModal(yi,bi,ki){const b=D.years[yi].buckets[bi];editCtx={yi,bi};document.getElementById('modalTitle').textContent=`${b.emoji} Edit ${b.name}`;document.getElementById('modalSub').textContent=`${D.years[yi].label} · Update your targets and results`;document.getElementById('modalBody').innerHTML=b.kpis.map((k,i)=>`<div class="modal-kpi-block"><div class="modal-kpi-label">${k.name}</div><div class="field-row"><div class="field-group"><label class="field-label">Planned</label><input class="field-input" type="number" id="fp_${i}" value="${k.planned}"/></div><div class="field-group"><label class="field-label">Achieved</label><input class="field-input" type="number" id="fa_${i}" value="${k.achieved}"/></div></div></div>`).join('');document.getElementById('modalBackdrop').classList.add('open');document.querySelector('#modalBody .field-input').focus();}
function closeModal(){document.getElementById('modalBackdrop').classList.remove('open');editCtx=null;}
function saveModal(){if(!editCtx)return;const b=D.years[editCtx.yi].buckets[editCtx.bi];b.kpis.forEach((k,i)=>{const pv=parseFloat(document.getElementById(`fp_${i}`).value),av=parseFloat(document.getElementById(`fa_${i}`).value);if(!isNaN(pv)&&pv>=0)k.planned=pv;if(!isNaN(av)&&av>=0)k.achieved=av;});save(D);closeModal();renderAll();}
document.getElementById('modalBackdrop').addEventListener('click',e=>{if(e.target===document.getElementById('modalBackdrop'))closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
function selectYear(i){YI=i;D.currentYear=i;save(D);renderAll();}
document.getElementById('sidebarNav').querySelectorAll('.nav-item').forEach(btn=>{btn.addEventListener('click',()=>{document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));btn.classList.add('active');closeSidebar();});});
function openSidebar(){document.getElementById('sidebar').classList.add('open');document.getElementById('sidebarOverlay').classList.add('open');}
function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('sidebarOverlay').classList.remove('open');}
function renderAll(){renderGreeting();renderDate();renderWeekStreak();renderHero();renderYearTabs();renderStats();renderKPICards();renderCharts();}
renderAll();
</script>
